services:
  app-local:
    profiles: ['local']
    image: drunkify:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PUBLIC_URL: http://localhost:3000
      COOKIE_SECURE: 'false'
      ADMIN_EMAIL: admin@example.com
      TRUST_PROXY: 'false'
      MAILER: log
      GEO_VENUE_PROVIDER: none
    volumes:
      - drunkify-data:/data
    healthcheck:
      test: ['CMD', 'node', './dist/cli/healthcheck.js']
      interval: 30s
      timeout: 3s
      retries: 3

  app-prod:
    profiles: ['prod']
    image: drunkify:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PUBLIC_URL: https://drunkify.example.com
      COOKIE_SECURE: 'true'
      ADMIN_EMAIL: admin@example.com
      TRUST_PROXY: 'true'
      MAILER: log
      GEO_VENUE_PROVIDER: none
    volumes:
      - drunkify-data:/data
    healthcheck:
      test: ['CMD', 'node', './dist/cli/healthcheck.js']
      interval: 30s
      timeout: 3s
      retries: 3

  caddy:
    profiles: ['prod']
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DRUNKIFY_SITE: ${DRUNKIFY_SITE:-drunkify.example.com}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app-prod

volumes:
  drunkify-data:
  caddy-data:
  caddy-config:
